[project]
name = "slate"
version = "0.1.0"
description = "Slate: a film studio any agent can run. Brand-agnostic video production: story, voice, motion, sound, QA and delivery, driven from one command-line tool."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary (Quinn O'Donnell); shareable later" }
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "Pillow>=10.0",
  "jsonschema>=4.21",
  "mcp>=1.2",
]

[project.optional-dependencies]
ocr = ["ocrmac>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
slate = "slate.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
